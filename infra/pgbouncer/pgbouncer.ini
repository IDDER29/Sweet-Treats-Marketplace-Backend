; PgBouncer — connection pooler in front of Postgres.
;
; Why: Postgres spends ~10MB and a backend process per connection. A pool of API
; + worker replicas, each with its own TypeORM pool, multiplies into hundreds of
; backends and starves the database. PgBouncer multiplexes thousands of client
; connections onto a small set of server connections.
;
; Mode: `transaction` — a server connection is assigned to a client only for the
; duration of a transaction, then returned to the pool. This is the highest-reuse
; mode and fits a stateless request/response API. Caveats handled below.

[databases]
; Route the app database to the real Postgres. In compose this host is `postgres`;
; override with env/templating in other environments.
sweet_treats = host=postgres port=5432 dbname=sweet_treats

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- Auth ---------------------------------------------------------------------
; Prefer auth_query over a static userlist so credentials live only in Postgres.
; Create a least-privilege lookup role and grant it access to pg_shadow:
;   CREATE ROLE pgbouncer_auth LOGIN PASSWORD '...';
;   GRANT pg_read_all_settings TO pgbouncer_auth;  -- plus a SECURITY DEFINER
;   -- function wrapping pg_shadow, per the PgBouncer docs.
; For a simple/static setup, point auth_file at userlist.txt instead.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; auth_user = pgbouncer_auth
; auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1

; --- Pooling ------------------------------------------------------------------
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600

; --- Transaction-mode correctness ---------------------------------------------
; Session-level state can't survive across transactions in this mode. Allow the
; client to send startup params the pooler can safely ignore.
ignore_startup_parameters = extra_float_digits,options
; PgBouncer 1.21+ supports protocol-level prepared statements in transaction
; mode; node-postgres/TypeORM use unnamed statements, but set a cap for safety.
max_prepared_statements = 200

; --- Ops ----------------------------------------------------------------------
; Expose the admin console to a maintenance role for SHOW POOLS / SHOW STATS.
admin_users = postgres
stats_users = postgres
log_connections = 0
log_disconnections = 0
