# Local stack with prod parity: Postgres, Redis, MailHog (SMTP), MinIO (S3),
# plus the API and a dedicated queue worker built from the same image.
#   docker compose up --build
# API: http://localhost:3000  · Swagger: /api/docs · MailHog UI: :8025 · MinIO: :9001
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweet_treats
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports: ['1025:1025', '8025:8025'] # SMTP, web UI

  minio:
    image: minio/minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  # One-shot: create the bucket and make the products prefix world-readable so
  # STORAGE_CDN_URL serves images directly in local dev.
  createbuckets:
    image: minio/mc
    depends_on: { minio: { condition: service_started } }
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin;
        do echo 'waiting for minio'; sleep 1; done;
        mc mb -p local/sweet-treats;
        mc anonymous set download local/sweet-treats;
        exit 0

  api:
    build: .
    environment: &app-env
      NODE_ENV: production # exercises migrationsRun (real prod schema path)
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: sweet_treats
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-compose-secret-change-me
      MAIL_HOST: mailhog
      MAIL_PORT: '1025'
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: sweet-treats
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_ENDPOINT: http://minio:9000 # S3-compatible store for local dev
      STORAGE_CDN_URL: http://localhost:9000/sweet-treats
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      PROCESS_QUEUES: 'false' # API enqueues only; the worker processes
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ['node', 'dist/worker']
    environment:
      <<: *app-env
      PROCESS_QUEUES: 'true'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
